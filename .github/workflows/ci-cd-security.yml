# CI/CD pipeline with OWASP-oriented security scanning.
# Philosophy: scans are ALERTS, not BLOCKERS. The only things that can stop
# the pipeline are "does it build/pass tests" and "is there a leaked secret".
name: ci-cd-security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to the repo's Security tab

jobs:

  # ---- Stage: BUILD (hard gate: must compile and pass tests) ----
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/demo-app-*.jar

  # ---- Stage: SCA (soft gate) - OWASP A06 Vulnerable and Outdated Components ----
  sca-scan:
    name: SCA (Dependency-Check)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Cache vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Run Dependency-Check
        continue-on-error: true            # never blocks
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS=""
          if [ -n "$NVD_API_KEY" ]; then ARGS="-DnvdApiKey=$NVD_API_KEY"; fi
          mvn -B org.owasp:dependency-check-maven:12.1.0:check \
            -Dformat=SARIF -DossindexAnalyzerEnabled=false $ARGS
      - name: Send results to the Security tab
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: sca-dependency-check
      - name: Keep the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: target/dependency-check-report.sarif
          if-no-files-found: ignore

  # ---- Stage: SAST (soft gate) - OWASP A02, A03, A05 and others ----
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Run Semgrep
        continue-on-error: true            # never blocks
        run: >
          semgrep scan --config p/owasp-top-ten --config p/java
          --sarif --output semgrep.sarif
      - name: Send results to the Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: sast-semgrep
      - name: Keep the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep.sarif
          if-no-files-found: ignore

  # ---- Stage: SECRET SCAN (HARD gate - the one deliberate exception) ----
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # scan history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # no continue-on-error: a finding fails this job

  # ---- Stage: DEPLOY (placeholder) ----
  deploy-staging:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [build, secret-scan]            # SCA/SAST/DAST do NOT gate deployment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: echo "Deploy ${{ github.sha }} here (kubectl, ssh, Render, etc.)"

  # ---- Stage: DAST (soft gate, runs in parallel) - OWASP A01, A05, A07 ----
  # Starts the app inside the runner and scans it, so no staging server is needed.
  dast-scan:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Start the app
        run: |
          nohup java -jar demo-app-*.jar > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health
      - name: Run ZAP baseline scan
        continue-on-error: true            # never blocks
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t 'http://localhost:8080/hello?name=test' \
            -r zap-report.html -J zap-report.json -I
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap-out/
          if-no-files-found: ignore
